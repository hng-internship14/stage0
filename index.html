<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">
    <article data-testid="test-todo-card" class="card" id="card">

      <header class="card-header">
        <h2 data-testid="test-todo-title" id="todo-title">
        </h2>

        <div class="meta">
          <span data-testid="test-todo-priority" id="priority-badge">
          </span>

          <select data-testid="test-todo-status-control" id="status-control">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Done</option>
          </select>

          <span data-testid="test-todo-status" id="todo-status">
          </span>
        </div>
      </header>

      <div data-testid="test-todo-collapsible-section" id="desc-container">
        <p data-testid="test-todo-description" id="todo-desc"></p>
      </div>

      <button data-testid="test-todo-expand-toggle" id="expand-btn" aria-expanded="false"
        aria-controls="desc-container">
        Expand
      </button>

      <div class="dates">
        <time data-testid="test-todo-due-date" id="due-date"></time>
        <time data-testid="test-todo-time-remaining" id="time-remaining" aria-live="polite"></time>
        <span data-testid="test-todo-overdue-indicator" id="overdue"></span>
      </div>

      <div class="toggle-group">
        <label for="toggle">Mark as done</label>
        <input type="checkbox" id="toggle" data-testid="test-todo-complete-toggle">
      </div>

      <ul data-testid="test-todo-tags" class="tags">
        <li data-testid="test-todo-tag-work">Work</li>
        <li data-testid="test-todo-tag-urgent">Urgent</li>
        <li>Gym</li>
      </ul>

      <div class="actions">
        <button data-testid="test-todo-edit-button" id="edit-btn">Edit</button>
        <button data-testid="test-todo-delete-button">Delete</button>
      </div>

      <!-- EDIT FORM -->
      <form data-testid="test-todo-edit-form" id="edit-form" hidden aria-labelledby="todo-title">

        <div>
          <label for="edit-title">Title</label>
          <input data-testid="test-todo-edit-title-input" id="edit-title" type="text" />
        </div>

        <div>
          <label for="edit-desc">Description</label>
          <textarea data-testid="test-todo-edit-description-input" id="edit-desc"></textarea>
        </div>

        <div class="form-row">
          <div>
            <label for="edit-priority">Priority</label>
            <select data-testid="test-todo-edit-priority-select" id="edit-priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div>
            <label for="edit-date">Due Date</label>
            <input type="date" data-testid="test-todo-edit-due-date-input" id="edit-date" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" data-testid="test-todo-save-button">
            Save
          </button>

          <button type="button" data-testid="test-todo-cancel-button" id="cancel-btn">
            Cancel
          </button>
        </div>

      </form>
    </article>
  </main>

  <script src="script.js"></script>
</body>

</html>
